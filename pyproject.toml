[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bankcsv"
version = "0.2.0"
description = "Clean garbage bank/client CSV exports into boring, consistent CSVs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "p2plus" }]
keywords = ["csv", "bank", "finance", "clean", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
  "Topic :: Text Processing",
]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]

[project.scripts]
bankcsv = "bankcsv:main"

[tool.setuptools]
py-modules = ["bankcsv"]
